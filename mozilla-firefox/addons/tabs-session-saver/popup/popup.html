<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1 class="header-title">Tabs Saver</h1>
    <button id="settings-btn" class="icon-btn" title="Settings">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
        <path d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.062 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"/>
      </svg>
    </button>
  </header>

  <!-- Settings Panel (hidden by default) -->
  <div id="settings-panel" class="settings-panel hidden">
    <label class="toggle-label">
      <input type="checkbox" id="new-window-toggle" checked>
      <span>Open collections in a new window</span>
    </label>
  </div>

  <!-- Save Section -->
  <div class="save-section">
    <button id="save-btn" class="btn btn-primary">Save All Tabs</button>

    <!-- Scope Picker -->
    <div id="scope-picker" class="scope-picker hidden">
      <p class="scope-label">Save tabs from:</p>
      <div class="scope-options">
        <button id="scope-current" class="btn btn-scope" title="Save tabs in the current window only">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
            <rect x="2" y="4" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="5" y="7" width="10" height="1.5" rx="0.75" fill="currentColor"/>
            <rect x="5" y="10" width="7" height="1.5" rx="0.75" fill="currentColor"/>
          </svg>
          Current Window
        </button>
        <button id="scope-all" class="btn btn-scope" title="Save tabs across all open Firefox windows">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
            <rect x="1" y="6" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="6" y="4" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="8" y="8" width="8" height="1.4" rx="0.7" fill="currentColor"/>
            <rect x="8" y="10.8" width="5" height="1.4" rx="0.7" fill="currentColor"/>
          </svg>
          All Windows
        </button>
      </div>
    </div>

    <!-- Window Selector (for "All Windows" mode) -->
    <div id="window-selector" class="window-selector hidden">
      <p class="selector-label">Select windows to save:</p>
      <div id="windows-list" class="windows-list"></div>
      <div class="selector-actions">
        <button id="windows-confirm" class="btn btn-primary btn-sm">Continue</button>
        <button id="windows-cancel" class="btn btn-secondary btn-sm">Cancel</button>
      </div>
    </div>

    <!-- Name Form -->
    <div id="save-form" class="save-form hidden">
      <input type="text" id="collection-name" class="input" placeholder="Collection name">
      <div class="save-form-actions">
        <button id="save-confirm" class="btn btn-primary btn-sm">Save</button>
        <button id="save-cancel" class="btn btn-secondary btn-sm">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Collections List -->
  <div id="collections-list" class="collections-list"></div>

  <!-- Empty State -->
  <div id="empty-state" class="empty-state hidden">
    <p>No saved collections yet.</p>
    <p class="empty-hint">Click "Save All Tabs" to save your open tabs.</p>
  </div>

  <!-- Import Section -->
  <div class="import-section">
    <button id="import-btn" class="btn btn-secondary">Import Collection</button>
  </div>

  <!-- Status Message -->
  <div id="status-msg" class="status-msg hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
