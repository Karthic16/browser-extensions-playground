<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Import Collection - Tabs Session Saver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f9f9fb;
      color: #15141a;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 40px 48px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 440px;
      width: 90%;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { color: #5b5b66; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    label.choose-btn {
      display: inline-block;
      padding: 10px 24px;
      background: #0060df;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    label.choose-btn:hover { background: #003eaa; }
    #file-input { display: none; }
    #status {
      margin-top: 20px;
      font-size: 14px;
      min-height: 20px;
    }
    .success { color: #058b00; }
    .error { color: #c50042; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="12" width="42" height="33" rx="4" fill="#0060df"/>
      <rect x="3" y="6" width="18" height="9" rx="3" fill="#0060df"/>
      <rect x="9" y="20" width="30" height="3" rx="1.5" fill="#fff"/>
      <rect x="9" y="27" width="22" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
      <rect x="9" y="34" width="16" height="3" rx="1.5" fill="#fff" opacity="0.4"/>
    </svg>
    <h1>Import Tab Collection</h1>
    <p>Select a <strong>.json</strong> file previously exported from Tabs Session Saver. The collection will be added and this tab will close automatically.</p>
    <label class="choose-btn" for="file-input">Choose JSON File</label>
    <input type="file" id="file-input" accept=".json">
    <div id="status"></div>
  </div>
  <script src="import-page.js"></script>
</body>
</html>
